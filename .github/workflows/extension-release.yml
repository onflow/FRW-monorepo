name: Extension Store Release

# CD pipeline for the Chrome Web Store (#1430).
# Cut a release by pushing a tag `release/ext-x.y.z` whose version matches
# apps/extension/package.json (injected into the manifest at build time),
# or run it from the Actions tab (workflow_dispatch) on a branch: the version is then read
# from apps/extension/package.json and the GitHub release is tagged `release/ext-<version>`.
# The publish job runs in the `chrome-webstore` GitHub environment; configure
# required reviewers on that environment to keep a human gate before publish.

on:
  push:
    tags:
      - "release/ext-*"
  workflow_dispatch:
    inputs:
      deploy_percentage:
        description: "Percent of users who get this version once Chrome Web Store review passes (1-100). Staged rollout only applies to items with 10,000+ users."
        required: false
        default: "100"

permissions:
  contents: write

concurrency:
  group: extension-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for tag listing
          fetch-tags: true

      - name: Get previous release tag
        id: prev_tag
        run: |
          # Newest non-beta tag excluding the one being released
          PREV_TAG=$(git tag --sort=-committerdate | grep -v "beta" | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || echo "")
          echo "latest_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous release tag: $PREV_TAG"

      - name: Resolve and validate release version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual run from a branch: package.json decides the version
            VERSION=$(jq -r .version apps/extension/package.json)
          else
            VERSION="${GITHUB_REF_NAME#release/ext-}"
          fi
          # package.json is the single source of truth: prepareManifest injects it into the
          # generated _raw/manifest.json at build time (manifest.pro.json's own version is stale).
          PKG_VERSION=$(jq -r .version apps/extension/package.json)
          echo "Tag: $GITHUB_REF_NAME (version $VERSION)"
          echo "package.json: $PKG_VERSION"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($VERSION) must match apps/extension/package.json ($PKG_VERSION). Bump the version, commit, then re-cut the tag."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Create environment file
        run: |
          cat << EOF > apps/extension/.env.pro
          # Git info
          COMMIT_SHA="${{ github.sha }}"
          BRANCH_NAME="${{ github.ref_name }}"
          DEPLOYMENT_ENV="production"
          REPO_URL="https://github.com/${{ github.repository }}"
          LATEST_TAG="${{ steps.prev_tag.outputs.latest_tag }}"
          IS_BETA="false"
          BETA_VERSION=""

          # Google drive
          GD_BACKUP_NAME="${{ vars.GD_BACKUP_NAME }}"
          GD_FOLDER="${{ vars.GD_FOLDER }}"
          GD_AES_KEY="${{ secrets.GD_AES_KEY }}"
          GD_IV="${{ secrets.GD_IV }}"
          GOOGLE_API="${{ secrets.GOOGLE_API }}"
          # Google Drive backup stays off until OAUTH2_CLIENT_ID is a client outside GCP project 556216024625
          GOOGLE_DRIVE_BACKUP_ENABLED="${{ vars.GOOGLE_DRIVE_BACKUP_ENABLED || 'false' }}"
          # Backend hosts (Firebase removed; FB_* secrets are no longer read)
          API_NEWS_PATH="${{ vars.API_NEWS_PATH }}"
          API_CONFIG_PATH="${{ vars.API_CONFIG_PATH }}"
          API_BASE_URL="${{ vars.API_BASE_URL || 'https://web.api.wallet.flow.com' }}"
          API_GO_SERVER_URL="${{ vars.API_GO_SERVER_URL || 'https://api.wallet.flow.com' }}"
          FUNCTIONS_URL="${{ vars.FUNCTIONS_URL || 'https://functions.wallet.flow.com' }}"
          SCANNER_URL="${{ vars.SCANNER_URL || 'https://scanner.wallet.flow.com' }}"
          LINK_URL="${{ vars.LINK_URL || 'https://link.wallet.flow.com' }}"
          # sentry
          SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
          # manifest
          MANIFEST_KEY="${{ secrets.MANIFEST_KEY }}"
          OAUTH2_CLIENT_ID="${{ secrets.OAUTH2_CLIENT_ID }}"
          OAUTH2_SCOPES="${{ vars.OAUTH2_SCOPES }}"
          WC_PROJECTID="${{ secrets.WC_PROJECTID }}"
          MIXPANEL_TOKEN="${{ secrets.MIXPANEL_TOKEN }}"
          SCRIPTS_PUBLIC_KEY="${{ vars.SCRIPTS_PUBLIC_KEY }}"
          BETA_MANIFEST_KEY="${{ secrets.BETA_MANIFEST_KEY }}"
          BETA_OAUTH2_CLIENT_ID="${{ secrets.BETA_OAUTH2_CLIENT_ID }}"
          EOF

      - name: Guard against retired hosts
        run: |
          # lilico.app and the lilico-334404 Cloud Functions are gone; fail fast if a repo
          # variable still points at them (update the variable in Settings > Environments > production).
          if grep -nE 'lilico\.app|cloudfunctions\.net|^FB_' apps/extension/.env.pro | grep -vE '^[0-9]+:#'; then
            echo "::error::apps/extension/.env.pro still references lilico.app, cloudfunctions.net or FB_* (see lines above)"
            exit 1
          fi

      - name: Build packages
        run: pnpm build:packages

      - name: Build extension (production)
        run: pnpm -F frw-extension build:ci
        env:
          CI: true
          CI_BUILD_ID: ${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEPLOYMENT_ENV: production

      - name: Zip dist
        run: |
          cd apps/extension/dist
          zip -r "../FlowCore_${{ steps.version.outputs.version }}.zip" .

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowCore-${{ steps.version.outputs.version }}
          path: apps/extension/FlowCore_${{ steps.version.outputs.version }}.zip
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Secrets live here; add required reviewers to this environment to gate publish.
    environment: chrome-webstore
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release zip
        uses: actions/download-artifact@v4
        with:
          name: FlowCore-${{ needs.build.outputs.version }}

      - name: Upload and publish to Chrome Web Store
        env:
          # chrome-webstore-upload-cli v4 removed the auth flags; env vars only (fregante/chrome-webstore-upload-cli#80)
          EXTENSION_ID: ${{ secrets.CWS_ITEM_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          pnpm --filter frw-extension exec chrome-webstore-upload \
            --source "FlowCore_${{ needs.build.outputs.version }}.zip" \
            --deploy-percentage "${{ github.event.inputs.deploy_percentage || '100' }}"

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v4
        with:
          name: FlowCore-${{ needs.build.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="release/ext-${{ needs.build.outputs.version }}"
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            "FlowCore_${{ needs.build.outputs.version }}.zip" \
            --title "Flow Wallet Extension ${{ needs.build.outputs.version }}" \
            --generate-notes
