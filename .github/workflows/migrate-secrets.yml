name: Sync Secrets to Monorepo

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: GitHub org/user for target repo (e.g., onflow)
        required: true
        default: onflow
      target_repo:
        description: Target monorepo name (e.g., FRW or FRW-monorepo)
        required: true
      target_env_dev_name:
        description: Target environment name for development (destination)
        required: false
        default: development
      target_env_prod_name:
        description: Target environment name for production (destination)
        required: false
        default: production
      # Source environments (in the OLD Android repo) to read from
      read_source_dev:
        description: Read secrets from source environment "dev" and sync to target android-dev
        type: boolean
        required: false
        default: true
      read_source_production:
        description: Read secrets from source environment "production" and sync to target android-prod
        type: boolean
        required: false
        default: true
      sync_android_dev:
        description: Also sync to target environment android-dev
        type: boolean
        required: false
        default: false
      sync_android_prod:
        description: Also sync to target environment android-prod
        type: boolean
        required: false
        default: false
      sync_repo_level:
        description: Also sync to target repository-level secrets
        type: boolean
        required: false
        default: false
      use_api_for_env:
        description: Use GitHub API (safer) for env secrets instead of secrets-sync-action
        type: boolean
        required: false
        default: false

jobs:
  repo_level:
    if: ${{ inputs.sync_repo_level }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync repo-level secrets to target
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          secrets: |
            # New monorepo Android CI names
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            # Legacy Android repo names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          # Map source repo secrets to step env so action can read values
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          # Legacy (if present in source repo)
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  env_android_dev:
    if: ${{ inputs.sync_android_dev && !inputs.use_api_for_env }}
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Sync secrets to target environment (dev)
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environment: ${{ inputs.target_env_dev_name || 'development' }}
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            # Legacy names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  env_android_prod:
    if: ${{ inputs.sync_android_prod && !inputs.use_api_for_env }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Sync secrets to target environment (prod)
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environment: ${{ inputs.target_env_prod_name || 'production' }}
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            # Legacy names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  # Read from SOURCE environment "dev" and sync to TARGET environment android-dev
  source_dev_to_target_dev:
    if: ${{ inputs.read_source_dev && inputs.sync_android_dev && !inputs.use_api_for_env }}
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Sync secrets from SOURCE env=dev to TARGET env (dev)
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environment: ${{ inputs.target_env_dev_name || 'development' }}
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  # Read from SOURCE environment "production" and sync to TARGET environment android-prod
  source_prod_to_target_prod:
    if: ${{ inputs.read_source_production && inputs.sync_android_prod && !inputs.use_api_for_env }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Sync secrets from SOURCE env=production to TARGET env (prod)
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environment: ${{ inputs.target_env_prod_name || 'production' }}
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  ensure_target_envs:
    if: ${{ inputs.use_api_for_env && (inputs.sync_android_dev || inputs.sync_android_prod) }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure target environments exist
        shell: bash
        run: |
          set -euo pipefail
          API=https://api.github.com
          hdr=( -H "Authorization: token ${{ secrets.MIGRATOR_PAT }}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" )
          owner='${{ inputs.target_owner }}'
          repo='${{ inputs.target_repo }}'
          dev='${{ inputs.target_env_dev_name || 'development' }}'
          prod='${{ inputs.target_env_prod_name || 'production' }}'
          for env in "$dev" "$prod"; do
            if [ -n "$env" ]; then
              echo "Ensuring environment: $env"
              curl -s -X PUT "${API}/repos/${owner}/${repo}/environments/${env}" "${hdr[@]}" -d '{}' >/dev/null || true
            fi
          done

  env_dev_api:
    if: ${{ inputs.use_api_for_env && inputs.sync_android_dev && inputs.read_source_dev }}
    runs-on: ubuntu-latest
    needs: ensure_target_envs
    environment:
      name: dev
    steps:
      - name: Write env secrets to target (development)
        shell: bash
        run: |
          set -euo pipefail
          cat > migrator.js <<'JS'
          const sodium = require('tweetsodium');
          const fetch = (...args) => import('node-fetch').then(({default: f}) => f(...args));
          const headers = (t) => ({ Authorization: `token ${t}`, 'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'secret-migrator'});
          async function getEnvPK(o,r,e,t){const res=await fetch(`https://api.github.com/repos/${o}/${r}/environments/${encodeURIComponent(e)}/secrets/public-key`,{headers:headers(t)});if(!res.ok){throw new Error(`get env pk ${res.status} ${await res.text()}`);}return res.json();}
          async function putEnv(o,r,e,t,name,enc,keyId){const res=await fetch(`https://api.github.com/repos/${o}/${r}/environments/${encodeURIComponent(e)}/secrets/${encodeURIComponent(name)}`,{method:'PUT',headers:{...headers(t),'Content-Type':'application/json'},body:JSON.stringify({encrypted_value:enc,key_id:keyId})});if(!res.ok){throw new Error(`put env ${name} ${res.status} ${await res.text()}`);}}
          function enc(pk,val){const m=Buffer.from(val);const k=Buffer.from(pk,'base64');const s=sodium.seal(m,k);return Buffer.from(s).toString('base64');}
          (async()=>{const owner='${{ inputs.target_owner }}';const repo='${{ inputs.target_repo }}';const envName='${{ inputs.target_env_dev_name || 'development' }}';const token='${{ secrets.MIGRATOR_PAT }}';
            const pairs=[
              ['GPR_USER',process.env.GPR_USER],
              ['GPR_KEY',process.env.GPR_KEY],
              ['ANDROID_FIREBASE_CREDENTIALS_B64',process.env.ANDROID_FIREBASE_CREDENTIALS_B64],
              ['ANDROID_GOOGLE_SERVICES_DEV_B64',process.env.ANDROID_GOOGLE_SERVICES_DEV_B64],
              ['ANDROID_KEY_PROPERTIES_B64',process.env.ANDROID_KEY_PROPERTIES_B64],
              ['FIREBASE_TESTERS',process.env.FIREBASE_TESTERS],
              ['FASTLANE_SA',process.env.FASTLANE_SA],
              ['GOOGLE_SERVICES',process.env.GOOGLE_SERVICES],
              ['KEYSTORE_BASE64',process.env.KEYSTORE_BASE64],
              ['KEY_PROPERTIES',process.env.KEY_PROPERTIES],
              ['LOCAL_PROPERTIES',process.env.LOCAL_PROPERTIES],
              ['SERVICE_ACCOUNT_JSON',process.env.SERVICE_ACCOUNT_JSON],
            ];
            const entries=pairs.filter(([_,v])=>v&&v.length>0);
            if(entries.length===0){console.log('No source secrets found for env dev');return;}
            const {key,key_id}=await getEnvPK(owner,repo,envName,token);
            let count=0;for(const [n,v] of entries){await putEnv(owner,repo,envName,token,n,enc(key,v),key_id);count++;}
            console.log(`Set ${count} secrets on environment ${envName}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          npm init -y >/dev/null 2>&1
          npm i tweetsodium node-fetch@2 >/dev/null 2>&1
          node migrator.js
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  env_prod_api:
    if: ${{ inputs.use_api_for_env && inputs.sync_android_prod && inputs.read_source_production }}
    runs-on: ubuntu-latest
    needs: ensure_target_envs
    environment:
      name: production
    steps:
      - name: Write env secrets to target (production)
        shell: bash
        run: |
          set -euo pipefail
          cat > migrator.js <<'JS'
          const sodium = require('tweetsodium');
          const fetch = (...args) => import('node-fetch').then(({default: f}) => f(...args));
          const headers = (t) => ({ Authorization: `token ${t}`, 'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'secret-migrator'});
          async function getEnvPK(o,r,e,t){const res=await fetch(`https://api.github.com/repos/${o}/${r}/environments/${encodeURIComponent(e)}/secrets/public-key`,{headers:headers(t)});if(!res.ok){throw new Error(`get env pk ${res.status} ${await res.text()}`);}return res.json();}
          async function putEnv(o,r,e,t,name,enc,keyId){const res=await fetch(`https://api.github.com/repos/${o}/${r}/environments/${encodeURIComponent(e)}/secrets/${encodeURIComponent(name)}`,{method:'PUT',headers:{...headers(t),'Content-Type':'application/json'},body:JSON.stringify({encrypted_value:enc,key_id:keyId})});if(!res.ok){throw new Error(`put env ${name} ${res.status} ${await res.text()}`);}}
          function enc(pk,val){const m=Buffer.from(val);const k=Buffer.from(pk,'base64');const s=sodium.seal(m,k);return Buffer.from(s).toString('base64');}
          (async()=>{const owner='${{ inputs.target_owner }}';const repo='${{ inputs.target_repo }}';const envName='${{ inputs.target_env_prod_name || 'production' }}';const token='${{ secrets.MIGRATOR_PAT }}';
            const pairs=[
              ['GPR_USER',process.env.GPR_USER],
              ['GPR_KEY',process.env.GPR_KEY],
              ['ANDROID_FIREBASE_CREDENTIALS_B64',process.env.ANDROID_FIREBASE_CREDENTIALS_B64],
              ['ANDROID_GOOGLE_SERVICES_PROD_B64',process.env.ANDROID_GOOGLE_SERVICES_PROD_B64],
              ['ANDROID_KEY_PROPERTIES_B64',process.env.ANDROID_KEY_PROPERTIES_B64],
              ['FASTLANE_SA',process.env.FASTLANE_SA],
              ['GOOGLE_SERVICES',process.env.GOOGLE_SERVICES],
              ['KEYSTORE_BASE64',process.env.KEYSTORE_BASE64],
              ['KEY_PROPERTIES',process.env.KEY_PROPERTIES],
              ['LOCAL_PROPERTIES',process.env.LOCAL_PROPERTIES],
              ['SERVICE_ACCOUNT_JSON',process.env.SERVICE_ACCOUNT_JSON],
            ];
            const entries=pairs.filter(([_,v])=>v&&v.length>0);
            if(entries.length===0){console.log('No source secrets found for env production');return;}
            const {key,key_id}=await getEnvPK(owner,repo,envName,token);
            let count=0;for(const [n,v] of entries){await putEnv(owner,repo,envName,token,n,enc(key,v),key_id);count++;}
            console.log(`Set ${count} secrets on environment ${envName}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          npm init -y >/dev/null 2>&1
          npm i tweetsodium node-fetch@2 >/dev/null 2>&1
          node migrator.js
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
    environment:
      name: production
    steps:
      - name: Sync secrets from SOURCE env=production to TARGET env (prod)
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environments: |
            ${{ inputs.target_env_prod_name || 'production' }}
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
