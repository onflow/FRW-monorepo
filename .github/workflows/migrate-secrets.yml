name: Sync Secrets to Monorepo

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: GitHub org/user for target repo (e.g., onflow)
        required: true
        default: onflow
      target_repo:
        description: Target monorepo name (e.g., FRW or FRW-monorepo)
        required: true
      # Source environments (in the OLD Android repo) to read from
      read_source_dev:
        description: Read secrets from source environment "dev" and sync to target android-dev
        type: boolean
        required: false
        default: true
      read_source_production:
        description: Read secrets from source environment "production" and sync to target android-prod
        type: boolean
        required: false
        default: true
      sync_android_dev:
        description: Also sync to target environment android-dev
        type: boolean
        required: false
        default: false
      sync_android_prod:
        description: Also sync to target environment android-prod
        type: boolean
        required: false
        default: false

jobs:
  repo_level:
    runs-on: ubuntu-latest
    steps:
      - name: Sync repo-level secrets to target
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          secrets: |
            # New monorepo Android CI names
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            # Legacy Android repo names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          # Map source repo secrets to step env so action can read values
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          # Legacy (if present in source repo)
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  env_android_dev:
    if: ${{ inputs.sync_android_dev }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync secrets to target environment android-dev
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environments: |
            android-dev
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            # Legacy names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  env_android_prod:
    if: ${{ inputs.sync_android_prod }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync secrets to target environment android-prod
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environments: |
            android-prod
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            # Legacy names (optional)
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  # Read from SOURCE environment "dev" and sync to TARGET environment android-dev
  source_dev_to_target_dev:
    if: ${{ inputs.read_source_dev && inputs.sync_android_dev }}
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Sync secrets from SOURCE env=dev to TARGET env=android-dev
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environments: |
            android-dev
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_DEV_B64
            ANDROID_KEY_PROPERTIES_B64
            FIREBASE_TESTERS
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

  # Read from SOURCE environment "production" and sync to TARGET environment android-prod
  source_prod_to_target_prod:
    if: ${{ inputs.read_source_production && inputs.sync_android_prod }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Sync secrets from SOURCE env=production to TARGET env=android-prod
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          github_token: ${{ secrets.MIGRATOR_PAT }}
          repositories: |
            ${{ inputs.target_owner }}/${{ inputs.target_repo }}
          environments: |
            android-prod
          secrets: |
            GPR_USER
            GPR_KEY
            ANDROID_FIREBASE_CREDENTIALS_B64
            ANDROID_GOOGLE_SERVICES_PROD_B64
            ANDROID_KEY_PROPERTIES_B64
            FASTLANE_SA
            GOOGLE_SERVICES
            KEYSTORE_BASE64
            KEY_PROPERTIES
            LOCAL_PROPERTIES
            SERVICE_ACCOUNT_JSON
          prune: false
        env:
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
          ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
          ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
          FASTLANE_SA: ${{ secrets.FASTLANE_SA }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
