name: Migrate Secrets to Monorepo

on:
  workflow_dispatch:
    inputs:
      target_owner:
        description: GitHub org/user for target repo (e.g., onflow)
        required: true
      target_repo:
        description: Target monorepo name (e.g., FRW)
        required: true
      target_env:
        description: Optional environment (e.g., android-dev or android-prod)
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Temporary PAT with permission to write secrets in target repo
      GITHUB_TOKEN_MIGRATOR: ${{ secrets.MIGRATOR_PAT }}
      TARGET_OWNER: ${{ inputs.target_owner }}
      TARGET_REPO: ${{ inputs.target_repo }}
      TARGET_ENV: ${{ inputs.target_env }}

      # Map secrets from THIS (old Android) repo:
      SECRET_GPR_USER: ${{ secrets.GPR_USER }}
      SECRET_GPR_KEY: ${{ secrets.GPR_KEY }}
      SECRET_ANDROID_FIREBASE_CREDENTIALS_B64: ${{ secrets.ANDROID_FIREBASE_CREDENTIALS_B64 }}
      SECRET_ANDROID_GOOGLE_SERVICES_DEV_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_DEV_B64 }}
      SECRET_ANDROID_GOOGLE_SERVICES_PROD_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_PROD_B64 }}
      SECRET_ANDROID_KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES_B64 }}
      SECRET_FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
      # Add any other secrets you want to migrate here…

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Migrate secrets to target repo (no logging of values)
        shell: bash
        run: |
          set -euo pipefail
          cat > migrator.js <<'JS'
          const sodium = require('tweetsodium');
          const fetch = (...args) => import('node-fetch').then(({default: f}) => f(...args));

          async function getRepoPublicKey(owner, repo, token) {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/secrets/public-key`, {
              headers: { Authorization: `token ${token}`, 'User-Agent': 'secret-migrator' }
            });
            if (!res.ok) throw new Error(`Failed to get public key: ${res.status}`);
            return res.json();
          }

          async function getEnvPublicKey(owner, repo, env, token) {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/environments/${encodeURIComponent(env)}/secrets/public-key`, {
              headers: { Authorization: `token ${token}`, 'User-Agent': 'secret-migrator' }
            });
            if (!res.ok) throw new Error(`Failed to get env public key: ${res.status}`);
            return res.json();
          }

          function encrypt(publicKey, value) {
            const messageBytes = Buffer.from(value);
            const keyBytes = Buffer.from(publicKey, 'base64');
            const encryptedBytes = sodium.seal(messageBytes, keyBytes);
            return Buffer.from(encryptedBytes).toString('base64');
          }

          async function putRepoSecret(owner, repo, token, name, enc, keyId) {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/secrets/${encodeURIComponent(name)}`, {
              method: 'PUT',
              headers: {
                Authorization: `token ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'secret-migrator'
              },
              body: JSON.stringify({ encrypted_value: enc, key_id: keyId })
            });
            if (!res.ok) throw new Error(`Failed to put repo secret ${name}: ${res.status}`);
          }

          async function putEnvSecret(owner, repo, env, token, name, enc, keyId) {
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/environments/${encodeURIComponent(env)}/secrets/${encodeURIComponent(name)}`, {
              method: 'PUT',
              headers: {
                Authorization: `token ${token}`,
                'Content-Type': 'application/json',
                'User-Agent': 'secret-migrator'
              },
              body: JSON.stringify({ encrypted_value: enc, key_id: keyId })
            });
            if (!res.ok) throw new Error(`Failed to put env secret ${name}: ${res.status}`);
          }

          (async () => {
            const owner = process.env.TARGET_OWNER;
            const repo  = process.env.TARGET_REPO;
            const envName = process.env.TARGET_ENV || '';
            const token = process.env.GITHUB_TOKEN_MIGRATOR;

            const entries = [
              ['GPR_USER', process.env.SECRET_GPR_USER],
              ['GPR_KEY', process.env.SECRET_GPR_KEY],
              ['ANDROID_FIREBASE_CREDENTIALS_B64', process.env.SECRET_ANDROID_FIREBASE_CREDENTIALS_B64],
              ['ANDROID_GOOGLE_SERVICES_DEV_B64', process.env.SECRET_ANDROID_GOOGLE_SERVICES_DEV_B64],
              ['ANDROID_GOOGLE_SERVICES_PROD_B64', process.env.SECRET_ANDROID_GOOGLE_SERVICES_PROD_B64],
              ['ANDROID_KEY_PROPERTIES_B64', process.env.SECRET_ANDROID_KEY_PROPERTIES_B64],
              ['FIREBASE_TESTERS', process.env.SECRET_FIREBASE_TESTERS],
            ].filter(([_, v]) => v && v.length > 0);

            if (!envName) {
              const { key, key_id } = await getRepoPublicKey(owner, repo, token);
              for (const [name, value] of entries) {
                const enc = encrypt(key, value);
                await putRepoSecret(owner, repo, token, name, enc, key_id);
                console.log(`✅ Migrated repo secret: ${name}`);
              }
            } else {
              const { key, key_id } = await getEnvPublicKey(owner, repo, envName, token);
              for (const [name, value] of entries) {
                const enc = encrypt(key, value);
                await putEnvSecret(owner, repo, envName, token, name, enc, key_id);
                console.log(`✅ Migrated env secret [${envName}]: ${name}`);
              }
            }
          })().catch(err => { console.error(err); process.exit(1); });
          JS

          npm init -y >/dev/null 2>&1
          npm i tweetsodium node-fetch@2 >/dev/null 2>&1
          node migrator.js

